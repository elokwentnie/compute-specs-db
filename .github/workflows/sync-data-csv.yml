name: Sync CPU & GPU CSV from API

on:
  schedule:
    # Daily at 12:00 UTC (cron in GitHub Actions is always UTC)
    - cron: "0 12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-data-csv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sync dependencies
        run: pip install -r scripts/requirements-sync.txt

      - name: Export production CPUs to cpu_spec_validated.csv
        env:
          # Hit Render directly to bypass the Cloudflare managed challenge that
          # blocks non-browser clients on https://computespecsdb.com. Falls back
          # to the public hostname if the secret isn't set.
          API_BASE: ${{ secrets.RENDER_DIRECT_URL || 'https://computespecsdb.com' }}
          DATASET: cpu
          CSV_PATH: cpu_spec_validated.csv
        run: python scripts/sync_db_to_csv.py

      - name: Export production GPUs to gpu_spec_validated.csv
        env:
          API_BASE: ${{ secrets.RENDER_DIRECT_URL || 'https://computespecsdb.com' }}
          DATASET: gpu
          CSV_PATH: gpu_spec_validated.csv
        run: python scripts/sync_db_to_csv.py

      - name: Open pull request if CSVs changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync CPU & GPU CSVs from production API"
          title: "Sync CPU & GPU specs from production"
          body: |
            Automated sync from [computespecsdb.com](https://computespecsdb.com) via
            `GET /api/export/csv` and `GET /api/export/gpus/csv`.

            Includes any CPUs or GPUs added or updated through the API/admin UI
            since the last merge.

            **Review before merging** — check for unexpected deletes or duplicates.
          branch: automated/sync-data-csv
          delete-branch: true
          add-paths: |
            cpu_spec_validated.csv
            gpu_spec_validated.csv
