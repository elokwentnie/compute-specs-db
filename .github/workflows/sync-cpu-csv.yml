name: Sync CPU CSV from API

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-cpu-csv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sync dependencies
        run: pip install -r scripts/requirements-sync.txt

      - name: Export production DB to cpu_spec_validated.csv
        env:
          # Hit Render directly to bypass the Cloudflare managed challenge that
          # blocks non-browser clients on https://computespecsdb.com. Falls back
          # to the public hostname if the secret isn't set.
          API_BASE: ${{ secrets.RENDER_DIRECT_URL || 'https://computespecsdb.com' }}
          CSV_PATH: cpu_spec_validated.csv
        run: python scripts/sync_db_to_csv.py

      - name: Open pull request if CSV changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync cpu_spec_validated.csv from production API"
          title: "Sync CPU specs from production"
          body: |
            Automated sync from [computespecsdb.com](https://computespecsdb.com) via `GET /api/export/csv`.

            Includes any CPUs added or updated through the API/admin UI since the last merge.

            **Review before merging** — check for unexpected deletes or duplicates.
          branch: automated/sync-cpu-csv
          delete-branch: true
