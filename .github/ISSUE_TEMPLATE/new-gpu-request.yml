name: Request New GPU Entry
description: Suggest a GPU to be added to the database
title: "[New GPU] "
labels: ["new-entry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Please fill in as many fields as you can.
        A source URL is required so we can verify the data.
        Tip: you can also suggest a GPU without a GitHub account at https://computespecsdb.com/propose

  - type: input
    id: gpu_model_name
    attributes:
      label: GPU Model Name
      description: Full name including vendor prefix
      placeholder: e.g. NVIDIA H200 NVL
    validations:
      required: true

  - type: input
    id: vendor
    attributes:
      label: Vendor
      placeholder: e.g. NVIDIA, AMD, Intel
    validations:
      required: true

  - type: input
    id: gpu_model
    attributes:
      label: GPU Model (short identifier)
      placeholder: e.g. H200 NVL, MI300X

  - type: input
    id: form_factor
    attributes:
      label: Form Factor
      placeholder: e.g. PCIe card, HGX / SXM module, OAM module

  - type: input
    id: memory_gb
    attributes:
      label: Memory (GB)
      placeholder: e.g. 141

  - type: input
    id: memory_type
    attributes:
      label: Memory Type
      placeholder: e.g. HBM3E, GDDR7

  - type: input
    id: tdp
    attributes:
      label: TDP (Watts)
      placeholder: e.g. 600

  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: e.g. Blackwell, Hopper, CDNA 3

  - type: input
    id: launch_year
    attributes:
      label: Launch Year
      placeholder: e.g. 2024

  - type: input
    id: memory_bandwidth_tbs
    attributes:
      label: Memory Bandwidth (TB/s)
      placeholder: e.g. 4.8

  - type: input
    id: fp64_tflops
    attributes:
      label: FP64 vector (TFLOPS)
      placeholder: e.g. 34

  - type: input
    id: fp32_tflops
    attributes:
      label: FP32 vector (TFLOPS)
      placeholder: e.g. 67

  - type: input
    id: fp16_bf16_tensor_tflops
    attributes:
      label: FP16/BF16 Tensor, dense (TFLOPS)
      placeholder: e.g. 989

  - type: input
    id: fp8_tensor_tflops
    attributes:
      label: FP8 Tensor, dense (TFLOPS)
      placeholder: e.g. 1979

  - type: input
    id: fp4_tensor_tflops
    attributes:
      label: FP4 Tensor, dense (TFLOPS)
      placeholder: e.g. 9000

  - type: input
    id: interconnect
    attributes:
      label: Interconnect
      placeholder: e.g. NVLink 5, Infinity Fabric

  - type: input
    id: interconnect_bandwidth_gbs
    attributes:
      label: Interconnect Bandwidth (GB/s)
      placeholder: e.g. 1800

  - type: input
    id: pcie_interface
    attributes:
      label: PCIe Interface
      placeholder: e.g. PCIe 5.0 x16

  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: Link to official spec page or trusted hardware database
      placeholder: e.g. https://www.nvidia.com/en-us/data-center/h200/
    validations:
      required: true

  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes
      description: Any other relevant information
